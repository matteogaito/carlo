[loggers]
keys=root,uvicorn,uvicorn_error,uvicorn_access

[handlers]
keys=default,access

[formatters]
keys=default,access

[logger_root]
level=INFO
handlers=default

[logger_uvicorn]
level=INFO
handlers=default
qualname=uvicorn
propagate=0

[logger_uvicorn_error]
level=INFO
handlers=default
qualname=uvicorn.error
propagate=0

[logger_uvicorn_access]
level=INFO
handlers=access
qualname=uvicorn.access
propagate=0

[handler_default]
class=StreamHandler
formatter=default
args=(sys.stderr,)

[handler_access]
class=StreamHandler
formatter=access
args=(sys.stdout,)

[formatter_default]
class=uvicorn.logging.DefaultFormatter
format=%(asctime)s %(levelprefix)s %(name)s %(message)s
datefmt=%Y-%m-%dT%H:%M:%S%z

[formatter_access]
class=uvicorn.logging.AccessFormatter
format=%(asctime)s %(levelprefix)s %(client_addr)s - "%(request_line)s" %(status_code)s
datefmt=%Y-%m-%dT%H:%M:%S%z
